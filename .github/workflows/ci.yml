name: Protected Baseline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-baseline:
    name: PHP, frontend, migration, CSS
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: linguacafe_test
          MYSQL_USER: linguacafe
          MYSQL_PASSWORD: linguacafe
          MYSQL_ROOT_PASSWORD: linguacafe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -plinguacafe"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: linguacafe_test
      DB_USERNAME: linguacafe
      DB_PASSWORD: linguacafe
      MAIL_MAILER: array
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, gd, mbstring, mysqli, pdo_mysql, pcntl, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/app/temp \
            storage/app/temp/dictionaries \
            storage/logs \
            bootstrap/cache

      - name: Run full PHPUnit suite
        run: ./vendor/bin/phpunit

      - name: Run frontend mounted tests
        run: npm run test:frontend

      - name: Run migration/static checks and production build
        run: npm run check:migration

      - name: Run CSS audit
        run: npm run check:css

      - name: Run dark-theme contrast guard
        run: node scripts/check-dark-theme-contrast.js

      - name: Check whitespace
        run: git diff --check
